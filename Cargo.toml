[package]
name = "boundstr"
version = "0.1.0"
authors = ["Kyungho Byoun <kyungho.byoun@gmail.com>"]
description = "A string type for Rust whose length is guaranteed to be within bounds."
edition = "2024"
rust-version = "1.91.0"
repository = "https://github.com/Byunk/boundstr"
readme = "README.md"
license = "MIT"

[features]
default = []
serde = ["dep:serde_core"]

[dependencies]
serde_core = { version = "1", optional = true }
str_indices = "0.4.4"
